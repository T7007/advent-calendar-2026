<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Just Joking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #8b5a2b,
                    #a0522d,
                    #6f4422
                );
            overflow-x: hidden;
        }

        .sparkles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    rgba(255,255,255,.7) 2px,
                    transparent 2px
                );

            background-size: 120px 120px;

            animation: sparkleMove 20s linear infinite;

            opacity: .3;
            z-index: 0;
        }

        @keyframes sparkleMove {

            from {
                background-position: 0 0;
            }

            to {
                background-position: 200px 200px;
            }

        }

        .card {

            position: relative;
            z-index: 2;

            background: rgba(255,248,240,0.94);

            border: 12px solid transparent;

            border-image:
                repeating-linear-gradient(
                    45deg,
                    #ffffff 0px,
                    #ffffff 10px,
                    #c62828 10px,
                    #c62828 20px
                ) 12;
        }

        .cracker {

            display: block;

            width: 260px;

            margin: 40px auto;

            cursor: pointer;

            animation:
                wobble 2.5s ease-in-out infinite;

            transition:
                transform 1s ease;

            filter:
                drop-shadow(
                    0 0 15px rgba(255,255,255,.35)
                );
        }

        @keyframes wobble {

            0% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }

            100% {
                transform: rotate(-2deg);
            }

        }

        .cracker.opened {

            animation:
                crackerPop 1s forwards;
        }

        @keyframes crackerPop {

            0% {

                transform:
                    scale(1)
                    rotate(0deg);

                opacity: 1;
            }

            40% {

                transform:
                    scale(1.1)
                    rotate(-6deg);
            }

            100% {

                transform:
                    scale(1.3)
                    rotate(6deg);

                opacity: 0;
            }

        }

        .bang {

            font-size: 2rem;

            text-align: center;

            margin-top: 10px;

            color: #c62828;

            animation:
                bangPop 0.5s ease;
        }

        @keyframes bangPop {

            from {

                transform: scale(0);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }

        }

        .hidden {
            display: none;
        }

        .reveal {

            animation:
                fadeIn 1s ease;
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }

        .joke {

            background:
                rgba(255,255,255,.45);

            padding: 20px;

            border-radius: 15px;

            margin-top: 20px;
        }

        h1 {
            color: #c62828;
        }

        h2 {
            color: #8b0000;
        }

    </style>

</head>

<body>

    <div class="sparkles"></div>

    <div class="tree">
        🎄
    </div>

    <div class="container">

        <div class="card">

            <h1>🎁 Day 4 🎁</h1>

            <p>
                A Christmas joke is hiding inside this cracker...
            </p>

            <img
                id="cracker"
                class="cracker"
                src="images/christmas-cracker.png"
                alt="Christmas Cracker"
                onclick="crackJoke()">

            <div
                id="bang"
                class="bang hidden">

                💥 BANG! 💥

            </div>

            <div id="message"
                 class="hidden reveal">

                <h2>
                    😂 Christmas Joke 😂
                </h2>

                <div class="joke">

                    <p>
                        <strong>
                            Q: Why is it getting harder to buy advent calendars?
                        </strong>
                    </p>

                    <p>
                        A: Their days are numbered!
                    </p>

                </div>

                <br>

                <h2>
                    ❤️ 25 Days ❤️<br>
                    of Christmas
                </h2>

            </div>

        </div>

    </div>

    <audio id="music">
        <source
            src="audio/the_mountain-kids-christmas-christmas-background-449469.mp3"
            type="audio/mpeg">
    </audio>

    <script>

        function crackJoke() {

            const cracker =
                document.getElementById("cracker");

            const message =
                document.getElementById("message");

            const bang =
                document.getElementById("bang");

            const music =
                document.getElementById("music");

            music.volume = 0.2;

            music.play();

            cracker.classList.add("opened");

            bang.classList.remove("hidden");

            setTimeout(() => {

                message.classList.remove("hidden");

                setTimeout(() => {

                    smoothScrollTo(
                        message.offsetTop,
                        2500
                    );

                }, 300);

            }, 1000);

        }

        function smoothScrollTo(target, duration) {

            const start =
                window.pageYOffset;

            const distance =
                target - start;

            const startTime =
                performance.now();

            function animate(currentTime) {

                const elapsed =
                    currentTime - startTime;

                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );

                const eased =
                    1 - Math.pow(
                        1 - progress,
                        3
                    );

                window.scrollTo(
                    0,
                    start + distance * eased
                );

                if (progress < 1) {

                    requestAnimationFrame(
                        animate
                    );

                }

            }

            requestAnimationFrame(
                animate
            );

        }

    </script>

</body>

</html>
