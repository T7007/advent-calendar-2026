<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Just Joking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #8b5a2b,
                    #a0522d,
                    #6f4422
                );
            overflow-x: hidden;
        }

        .sparkles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    rgba(255,255,255,.7) 2px,
                    transparent 2px
                );

            background-size: 120px 120px;

            animation: sparkleMove 20s linear infinite;

            opacity: .3;
            z-index: 0;
        }

        @keyframes sparkleMove {

            from {
                background-position: 0 0;
            }

            to {
                background-position: 200px 200px;
            }

        }

        .card {

            position: relative;
            z-index: 2;

            background: rgba(255,248,240,0.94);

            border: 12px solid transparent;

            border-image:
                repeating-linear-gradient(
                    45deg,
                    #ffffff 0px,
                    #ffffff 10px,
                    #c62828 10px,
                    #c62828 20px
                ) 12;
        }

        /* Candy Cane */

        .candy-cane {

            position: relative;

            width: 120px;
            height: 220px;

            margin: 40px auto;

            cursor: pointer;

            animation:
                wobble 2.5s ease-in-out infinite;

            transition:
                transform 1s ease;
        }

        .cane-top {

            position: absolute;

            top: 0;
            left: 20px;

            width: 80px;
            height: 80px;

            border: 20px solid white;

            border-bottom: none;
            border-left: none;

            border-radius: 0 80px 0 0;

            background:
                repeating-linear-gradient(
                    45deg,
                    #d62828 0px,
                    #d62828 12px,
                    white 12px,
                    white 24px
                );

            box-sizing: border-box;

            box-shadow:
                0 0 15px rgba(255,255,255,.25);
        }

        .cane-stick {

            position: absolute;

            top: 70px;
            left: 60px;

            width: 20px;
            height: 140px;

            border-radius: 12px;

            background:
                repeating-linear-gradient(
                    45deg,
                    #d62828 0px,
                    #d62828 12px,
                    white 12px,
                    white 24px
                );

            box-shadow:
                0 0 10px rgba(255,255,255,.35);
        }

        @keyframes wobble {

            0% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }

            100% {
                transform: rotate(-3deg);
            }
        }

        .candy-cane.opened {

            animation: snapOpen 1s forwards;
        }

        @keyframes snapOpen {

            0% {
                transform:
                    scale(1)
                    rotate(0deg);
            }

            50% {
                transform:
                    scale(1.2)
                    rotate(-12deg);
            }

            100% {

                transform:
                    scale(1.4)
                    rotate(20deg);

                opacity: 0;
            }
        }

        .hidden {
            display: none;
        }

        .reveal {

            animation:
                fadeIn 1s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .joke {

            background:
                rgba(255,255,255,.5);

            padding: 20px;

            border-radius: 15px;

            margin-top: 20px;
        }

        h1 {
            color: #c62828;
        }

        h2 {
            color: #8b0000;
        }

    </style>

</head>

<body>

    <div class="sparkles"></div>

    <div class="tree">
        🎄
    </div>

    <div class="container">

        <div class="card">

            <h1>🍪 Day 4 🍬</h1>

            <p>
                A Christmas joke is hiding inside this candy cane...
            </p>

            <div id="candycane"
                 class="candy-cane"
                 onclick="crackJoke()">

                <div class="cane-top"></div>
                <div class="cane-stick"></div>

            </div>

            <div id="message"
                 class="hidden reveal">

                <h2>
                    😂 Cracker Joke 😂
                </h2>

                <div class="joke">

                    <p>
                        <strong>
                            Q: Why is it harder to buy advent calendars?
                        </strong>
                    </p>

                    <p>
                        A: Their days are numbered!
                    </p>

                </div>

                <br>

                <h2>
                    ❤️ 25 Days ❤️<br>
                    of Christmas
                </h2>

            </div>

        </div>

    </div>

    <audio id="music">
        <source src="audio/atlasaudio-christmas-jazz-621548.mp3"
                type="audio/mpeg">
    </audio>

    <script>

        function crackJoke() {

            const cane =
                document.getElementById("candycane");

            const message =
                document.getElementById("message");

            const music =
                document.getElementById("music");

            music.volume = 0.2;

            music.play();

            cane.classList.add("opened");

            setTimeout(() => {

                message.classList.remove("hidden");

                setTimeout(() => {

                    smoothScrollTo(
                        message.offsetTop,
                        2500
                    );

                }, 300);

            }, 1000);

        }

        function smoothScrollTo(target, duration) {

            const start = window.pageYOffset;
            const distance = target - start;
            const startTime = performance.now();

            function animate(currentTime) {

                const elapsed =
                    currentTime - startTime;

                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );

                const eased =
                    1 - Math.pow(
                        1 - progress,
                        3
                    );

                window.scrollTo(
                    0,
                    start + distance * eased
                );

                if (progress < 1) {

                    requestAnimationFrame(
                        animate
                    );
                }

            }

            requestAnimationFrame(
                animate
            );

        }

    </script>

</body>
</html>
