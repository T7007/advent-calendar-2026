<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Day 13 Grid Test</title>

<style>

body {

    font-family: Arial, sans-serif;

    text-align: center;

    background: #fff8f0;

    padding: 20px;
}

#grid {

    display: grid;

    grid-template-columns:
        repeat(14, min(24px, 6vw));

    gap: 1px;

    justify-content: center;
}

.cell {

    width: 24px;
    height: 24px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: white;

    border: 1px solid #ddd;

    font-weight: bold;

    font-size: 0.9rem;

    user-select: none;

    touch-action: none;
}

.cell.selected {

    background: #ffe082;
}

.cell.found {

    background: gold;

    color: white;
}

</style>

</head>

<body>

<h1>🎄 Day 13 Grid Test 🎄</h1>

<div id="grid"></div>

<script>

const SIZE = 14;

const words = [

    "MISTLETOE",
    "REINDEER",
    "SANTA",
    "NUTCRACKER",
    "TINSEL",
    "CANDYCANE",
    "SLEIGHBELLS",
    "GINGERBREAD",
    "STOCKING",
    "STARLIGHT"

];

const directions = [

    [0,1],     // horizontal
    [1,0],     // vertical
    [1,1]      // diagonal

];

const grid = [];

for (let r = 0; r < SIZE; r++) {

    grid[r] = [];

    for (let c = 0; c < SIZE; c++) {

        grid[r][c] = "";
    }
}

const placedWords = [];

let selecting = false;

let selectedCells = [];

const foundWords =
    new Set();
      
function canPlace(
    word,
    row,
    col,
    dr,
    dc
) {

    for (let i = 0; i < word.length; i++) {

        const r = row + dr * i;
        const c = col + dc * i;

        if (
            r < 0 ||
            r >= SIZE ||
            c < 0 ||
            c >= SIZE
        ) {
            return false;
        }

        const existing =
            grid[r][c];

        if (
            existing !== "" &&
            existing !== word[i]
        ) {
            return false;
        }

    }

    return true;
}

function placeWord(word) {

    let placed = false;

    let attempts = 0;

    while (
        !placed &&
        attempts < 500
    ) {

        attempts++;

        const dir =
            directions[
                Math.floor(
                    Math.random() *
                    directions.length
                )
            ];

        const dr = dir[0];
        const dc = dir[1];

        const row =
            Math.floor(
                Math.random() * SIZE
            );

        const col =
            Math.floor(
                Math.random() * SIZE
            );

        if (
            !canPlace(
                word,
                row,
                col,
                dr,
                dc
            )
        ) {
            continue;
        }

        for (
            let i = 0;
            i < word.length;
            i++
        ) {

            const r =
                row + dr * i;

            const c =
                col + dc * i;

            grid[r][c] =
                word[i];
        }

        placedWords.push({

            word,

            start: [
                row,
                col
            ],

            end: [

                row +
                dr *
                (word.length - 1),

                col +
                dc *
                (word.length - 1)
            ]

        });

        placed = true;
    }

    if (!placed) {

        console.error(
            "Failed to place",
            word
        );
    }

}

function clearSelection() {

    document
        .querySelectorAll(
            ".selected"
        )
        .forEach(cell => {

            cell.classList.remove(
                "selected"
            );

        });

    selectedCells = [];
}

function startSelection(cell) {

    clearSelection();

    selecting = true;

    selectedCells.push(cell);

    cell.classList.add(
        "selected"
    );
}

function extendSelection(cell) {

    if (!selecting)
        return;

    if (
        selectedCells.includes(
            cell
        )
    ) {
        return;
    }

    selectedCells.push(cell);

    cell.classList.add(
        "selected"
    );
}
      
words.forEach(
    placeWord
);

const alphabet =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

for (
    let r = 0;
    r < SIZE;
    r++
) {

    for (
        let c = 0;
        c < SIZE;
        c++
    ) {

        if (
            grid[r][c] === ""
        ) {

            grid[r][c] =
                alphabet[
                    Math.floor(
                        Math.random() *
                        alphabet.length
                    )
                ];
        }

    }

}

const gridElement =
    document.getElementById(
        "grid"
    );

for (
    let r = 0;
    r < SIZE;
    r++
) {

    for (
        let c = 0;
        c < SIZE;
        c++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "cell";

        cell.textContent =
            grid[r][c];

        cell.dataset.row = r;
        cell.dataset.col = c;

      cell.addEventListener(
          "mousedown",
          () => startSelection(cell)
      );
      
      cell.addEventListener(
          "mouseenter",
          () => extendSelection(cell)
      );
      
      cell.addEventListener(
          "touchstart",
          e => {
      
              e.preventDefault();
      
              startSelection(cell);
      
          }
      );
      
      cell.addEventListener(
          "touchmove",
          e => {
      
              e.preventDefault();
      
              const touch =
                  document.elementFromPoint(
                      e.touches[0].clientX,
                      e.touches[0].clientY
                  );
      
              if (
                  touch &&
                  touch.classList.contains(
                      "cell"
                  )
              ) {
      
                  extendSelection(
                      touch
                  );
      
              }
      
          }
      );
          
        gridElement.appendChild(
            cell
        );
    }
}

document.addEventListener(
    "mouseup",
    finishSelection
);

document.addEventListener(
    "touchend",
    finishSelection
);

function finishSelection() {

    if (!selecting)
        return;

    selecting = false;

    const word =
        selectedCells
            .map(
                cell => cell.textContent
            )
            .join("");

    console.log(
        "Selected:",
        word
    );

    clearSelection();
}
      
console.log(
    "Placed Words"
);

console.table(
    placedWords
);

</script>

</body>

</html>
