<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 1 - Sleigh Bells</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="moon"></div>
    <div class="snow"></div>

    <div class="tree">
        <img src="images/dec01-tree.png"
         class="tree"
         alt="">
    </div>

    <div class="container">

        <div class="card">

            <h1>🎄 Day 1 🎄</h1>

            <p>
                Bron, your first Christmas surprise is waiting!
            </p>

            <div id="present" class="present" onclick="openGift()">

                <div class="lid"></div>

                <div class="box"></div>

                <div class="ribbon-vertical"></div>

                <div class="ribbon-horizontal"></div>

            </div>

            <div id="message" class="reveal hidden">

                <h1>❤️ 24 Days ❤️</h1>
                <h2>of Christmas</h2>
                
                <p>
                    Welcome to the future, where every day you'll discover a little something...
                </p>

                <p>
                    Let's start with a simple truth:
                </p>
                
                <p>
                    Our family is AWESOME!
                </p>

                <img
                    src="images/dec01-photo.png"
                    alt="Awesome Family"
                    class="photo">
                
            </div>

        </div>

    </div>

    <script>
    
    function openGift() {
    
        const present =
            document.getElementById("present");
    
        const message =
            document.getElementById("message");
    
        const music =
            document.getElementById("music");
    
        present.classList.add("open");
    
        music.play();
    
        setTimeout(() => {
            message.classList.remove("hidden");
        }, 1000);
    }
    
    </script>

    <audio id="music">
        <source src="audio/dec01-music.mp3" type="audio/mpeg">
    </audio>

</body>

</html>
