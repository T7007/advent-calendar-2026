<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 1 - Christmas Present</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="moon"></div>
    <div class="snow"></div>

    <div class="tree">
        <img src="images/dec01-tree.png"
         class="tree"
         alt="">
    </div>

    <div class="container">

        <div class="card">

            <h1>🎄 Day 1 🎄</h1>

            <p>
                Merry Christmas, Bron!!<br>
                <br>
                Welcome to the future of advent calendars, where every day you'll find something new...<br>
                <br>
                Open the present to kick off a month of fun...
            </p>

            <div id="present" class="present" onclick="openGift()">

                <div class="lid"></div>

                <div class="box"></div>

                <div class="ribbon-vertical"></div>

                <div class="ribbon-horizontal"></div>

            </div>

            <div id="message" class="reveal hidden">
                
                <p>
                    <br>
                    Our family is AWESOME!
                </p>

                <img
                    src="images/dec01-photo.png"
                    alt="Awesome Family"
                    class="photo">

                <h2>
                    ❤️ 24 Days ❤️<br>
                    of Christmas
                </h2>
                
            </div>

        </div>

    </div>

    <script>
    
    function openGift() {
    
        const present =
            document.getElementById("present");
    
        const message =
            document.getElementById("message");
    
        const music =
            document.getElementById("music");
    
        present.classList.add("open");
    
        music.play();
    
        setTimeout(() => {
        
            message.classList.remove("hidden");
        
            setTimeout(() => {
        

                setTimeout(() => {
                
                    message.classList.remove("hidden");
                
                    setTimeout(() => {
                
                        smoothScrollTo(message.offsetTop, 2500);
                
                    }, 300);
                
                }, 1000);
                
                
                function smoothScrollTo(target, duration) {
                
                    const start = window.pageYOffset;
                    const distance = target - start;
                    const startTime = performance.now();
                
                    function animate(currentTime) {
                
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                
                        const eased =
                            1 - Math.pow(1 - progress, 3);
                
                        window.scrollTo(
                            0,
                            start + distance * eased
                        );
                
                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        }
                    }
                
                    requestAnimationFrame(animate);
                }
            
        
            }, 300);
        
        }, 1000);
    }
    
    </script>

    <audio id="music">
        <source src="audio/dec01-music.mp3" type="audio/mpeg">
    </audio>

</body>

</html>
