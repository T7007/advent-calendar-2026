<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 1 - Sleigh Bells</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="moon"></div>
    <div class="snow"></div>

    <div class="tree">
        <img src="Images/tree.png"
         class="tree"
         alt="">
    </div>

    <div class="container">

        <div class="card">

            <h1>🎄 Day 1 🎄</h1>

            <p>
                Your first Christmas surprise is waiting...
            </p>

            <div id="present" class="present" onclick="openGift()">

                <div class="lid"></div>

                <div class="box"></div>

                <div class="ribbon-vertical"></div>

                <div class="ribbon-horizontal"></div>

            </div>

            <div id="message" class="reveal hidden">

                <h2>❤️ 24 Days of Christmas ❤️</h2>
                
                <p>
                    This year I wanted to make something a little different.
                </p>

                <p>
                    Every day you'll discover a little something...
                </p>

                <p>
                    Let's start with a simple truth:
                </p>
                
                <p>
                    Our family is AWESOME!
                </p>

                <img
                    src="Images/dec01-photo.png"
                    alt="A favourite memory"
                    class="photo">
                
            </div>

        </div>

    </div>

    <script>

        function openGift() {

            const present =
                document.getElementById("present");

            const message =
                document.getElementById("message");

            present.classList.add("open");

            setTimeout(() => {

                message.classList.remove("hidden");

            }, 1000);

        }

    </script>

</body>

</html>
