<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 1</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="container">
        <div class="card">

            <h1>❤️ 1st of December ❤️</h1>

            <p>I have a surprise for you...</p>

            <button onclick="showMessage()">
                Open
            </button>

            <div id="message" class="reveal hidden">
                One of my favourite things is waking up next to you.
            </div>

        </div>
    </div>

    <div class="tree">🎄</div>

    <div class="snow"></div>
    
    <script>
    function showMessage() {
        document.getElementById("message")
            .classList.remove("hidden");
    }
    </script>

</body>
</html>
