<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Christmas Advent Surprise</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">
    <div class="card">

        <h1>🎄 X of December 🎄</h1>

        <p>Today's surprise is waiting...</p>

        <button class="christmas-button"
                onclick="reveal()">
            Open
        </button>

        <div id="surprise"
             class="reveal hidden">

            Put the surprise here.

        </div>

    </div>
</div>

<script>
function reveal() {
    document
        .getElementById("surprise")
        .classList.remove("hidden");
}
</script>

</body>
</html>
