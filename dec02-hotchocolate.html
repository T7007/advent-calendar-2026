<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 2 - Family Puzzle</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .puzzle-container {
            width: 330px;
            height: 330px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
        }

        .tile {
            background-image: url("images/dec02-photo.png");
            background-size: 330px 330px;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .tile:hover {
            transform: scale(0.98);
        }

        .empty {
            background: rgba(255,255,255,0.25);
            border: 2px dashed rgba(255,255,255,0.4);
        }

        .instructions {
            text-align: center;
            margin: 15px;
        }

        .success {
            display: none;
            text-align: center;
            margin-top: 25px;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        
            background: linear-gradient(
                -45deg,
                #ff6b35,
                #f7931e,
                #d9480f,
                #732255
            );
        
            background-size: 400% 400%;
            animation: outbackSky 20s ease infinite;
        
            overflow-x: hidden;
            position: relative;
        }

        @keyframes outbackSky {
            0% {
                background-position: 0% 50%;
            }
        
            50% {
                background-position: 100% 50%;
            }
        
            100% {
                background-position: 0% 50%;
            }
        }

        .sunset {
            position: fixed;
        
            top: 40px;
            right: 40px;
        
            width: 120px;
            height: 120px;
        
            border-radius: 50%;
        
            background: #ffd166;
        
            box-shadow:
                0 0 40px rgba(255,209,102,.8),
                0 0 80px rgba(255,170,0,.4);
        
            pointer-events: none;
        
            z-index: 0;
        }

        .outback {
            position: fixed;
        
            left: 0;
            right: 0;
            bottom: 0;
        
            height: 180px;
        
            background:
                linear-gradient(
                    to top,
                    #70350f,
                    #9c5a1a
                );
        
            clip-path:
                polygon(
                    0% 100%,
                    0% 55%,
                    18% 65%,
                    35% 45%,
                    48% 60%,
                    65% 35%,
                    82% 55%,
                    100% 40%,
                    100% 100%
                );
        
            z-index: 0;
        }

        .lens-flares {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .lens-flares::before,
        .lens-flares::after {
            content: "";
        
            position: absolute;
        
            width: 500px;
            height: 500px;
        
            border-radius: 50%;
        
            background:
                radial-gradient(
                    rgba(255,255,255,.25),
                    rgba(255,255,255,0)
                );
        
            animation: drift 25s ease-in-out infinite;
        }

        .lens-flares::after {
            width: 300px;
            height: 300px;
        
            right: 10%;
            top: 20%;
        
            animation-duration: 18s;
        }

        @keyframes drift {
        
            0% {
                transform:
                    translate(-50px, 0px)
                    scale(1);
            }
        
            50% {
                transform:
                    translate(50px, -30px)
                    scale(1.15);
            }
        
            100% {
                transform:
                    translate(-50px, 0px)
                    scale(1);
            }
        }

        .tree {
            position: fixed;
        
            left: -20px;
            bottom: -30px;
        
            font-size: 260px;
        
            opacity: 0.55;
        
            filter:
                drop-shadow(0 0 10px rgba(0,0,0,.15));
        
            z-index: 1;
        
            pointer-events: none;
        }
        
    </style>

</head>

<audio id="music" loop>
    <source src="audio/the_mountain-christmas-rock-449464.mp3" type="audio/mpeg">
</audio>
    
<body>

<div class="outback"></div>
    
<div class="sunset"></div>

<div class="lens-flares"></div>

<div class="tree">🎄</div>

<div class="container">

    <div class="card">

        <h1>☕ Day 2 ☕</h1>

        <h2>
            Family Christmas Puzzle
        </h2>

        <p>
            Reassemble our photo to reveal today's surprise!
        </p>

        <p style="font-size:0.9rem; opacity:0.8;">
        (🎵 turn your sound up! 🎵)
        </p>

        <div id="puzzle" class="puzzle-container"></div>

        <div id="success" class="success">

            <h2>You did it!</h2>

            <p>
                Today's prize:
            </p>

            <p>
                ☕ Redeem this voucher for a proper coffee any time!
            </p>

            <h2>
                ❤️ 25 Days ❤️<br>
                of Christmas
            </h2>

        </div>

    </div>

</div>

<script>

const size = 3;
const total = size * size;

let tiles = [];
let musicStarted = false;

function initPuzzle() {

    tiles = [...Array(total).keys()];

    shuffle();

    render();
}

function shuffle() {

    for (let i = 0; i < 500; i++) {

        const emptyIndex = tiles.indexOf(8);

        const neighbours = getNeighbours(emptyIndex);

        const move =
            neighbours[
                Math.floor(Math.random() * neighbours.length)
            ];

        [tiles[emptyIndex], tiles[move]] =
            [tiles[move], tiles[emptyIndex]];
    }
}

function getNeighbours(index) {

    const row = Math.floor(index / size);
    const col = index % size;

    const neighbours = [];

    if (row > 0) neighbours.push(index - size);
    if (row < size - 1) neighbours.push(index + size);
    if (col > 0) neighbours.push(index - 1);
    if (col < size - 1) neighbours.push(index + 1);

    return neighbours;
}

function render() {

    const puzzle =
        document.getElementById("puzzle");

    puzzle.innerHTML = "";

    tiles.forEach((tileNumber, position) => {

        const tile =
            document.createElement("div");

        if (tileNumber === 8) {

            tile.className = "tile empty";

        } else {

            tile.className = "tile";

            const row =
                Math.floor(tileNumber / size);

            const col =
                tileNumber % size;

            const tileSize = 330 / size;
            
            tile.style.backgroundPosition =
                `-${col * tileSize}px -${row * tileSize}px`;
        }

        tile.addEventListener(
            "click",
            () => moveTile(position)
        );

        puzzle.appendChild(tile);

    });

}

function moveTile(position) {

    if (!musicStarted) {
    
        const music =
            document.getElementById("music");
    
        music.volume = 0.2;
        music.play();
    
        musicStarted = true;
    }
    
    const empty =
        tiles.indexOf(8);

    if (
        getNeighbours(empty)
        .includes(position)
    ) {

        [tiles[position], tiles[empty]] =
            [tiles[empty], tiles[position]];

        render();

        checkWin();
    }
}

function checkWin() {

    const solved =
        tiles.every(
            (value, index) => value === index
        );

    if (solved) {

        document
            .getElementById("success")
            .style.display = "block";

        const music =
            document.getElementById("music");
        music.loop = false;
        music.volume = 0.1;

        setTimeout(() => {
    
            smoothScrollTo(
                success.offsetTop,
                2500
            );
    
        }, 300);
        
    }
}

function smoothScrollTo(target, duration) {

    const start = window.pageYOffset;
    const distance = target - start;
    const startTime = performance.now();

    function animate(currentTime) {

        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const eased =
            1 - Math.pow(1 - progress, 3);

        window.scrollTo(
            0,
            start + distance * eased
        );

        if (progress < 1) {
            requestAnimationFrame(animate);
        }
    }

    requestAnimationFrame(animate);
}

initPuzzle();

</script>

</body>

</html>
