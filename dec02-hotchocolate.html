<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 2 - Hot Chocolate</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .puzzle-container {
            width: 320px;
            height: 320px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
        }

        .tile {
            background-image: url("images/dec02-photo.png");
            background-size: 320px 320px;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .tile:hover {
            transform: scale(0.98);
        }

        .empty {
            background: rgba(255,255,255,0.25);
            border: 2px dashed rgba(255,255,255,0.4);
        }

        .instructions {
            text-align: center;
            margin: 15px;
        }

        .success {
            display: none;
            text-align: center;
            margin-top: 25px;
        }

    </style>

</head>

<audio id="music" loop>
    <source src="audio/the_mountain-christmas-rock-449464.mp3" type="audio/mpeg">
</audio>
    
<body>

<div class="snow"></div>

<div class="tree">🎄</div>

<div class="container">

    <div class="card">

        <h1>☕ Day 2 ☕</h1>

        <h2>
            Family Christmas Puzzle
        </h2>

        <p>
            Reassemble our photo to reveal today's surprise!
        </p>

        <p style="font-size:0.9rem; opacity:0.8;">
        (🎵 turn your sound up! 🎵)
        </p>

        <div id="puzzle" class="puzzle-container"></div>

        <div id="success" class="success">

            <h2>You did it!</h2>

            <p>
                Today's prize:
            </p>

            <p>
                ☕ Redeem this voucher for a proper coffee any time!
            </p>

        </div>

    </div>

</div>

<script>

const size = 4;
const total = size * size;

let tiles = [];
let musicStarted = false;

function initPuzzle() {

    tiles = [...Array(total).keys()];

    shuffle();

    render();
}

function shuffle() {

    for (let i = 0; i < 500; i++) {

        const emptyIndex = tiles.indexOf(15);

        const neighbours = getNeighbours(emptyIndex);

        const move =
            neighbours[
                Math.floor(Math.random() * neighbours.length)
            ];

        [tiles[emptyIndex], tiles[move]] =
            [tiles[move], tiles[emptyIndex]];
    }
}

function getNeighbours(index) {

    const row = Math.floor(index / size);
    const col = index % size;

    const neighbours = [];

    if (row > 0) neighbours.push(index - size);
    if (row < size - 1) neighbours.push(index + size);
    if (col > 0) neighbours.push(index - 1);
    if (col < size - 1) neighbours.push(index + 1);

    return neighbours;
}

function render() {

    const puzzle =
        document.getElementById("puzzle");

    puzzle.innerHTML = "";

    tiles.forEach((tileNumber, position) => {

        const tile =
            document.createElement("div");

        if (tileNumber === 15) {

            tile.className = "tile empty";

        } else {

            tile.className = "tile";

            const row =
                Math.floor(tileNumber / size);

            const col =
                tileNumber % size;

            tile.style.backgroundPosition =
                `-${col * 80}px -${row * 80}px`;
        }

        tile.addEventListener(
            "click",
            () => moveTile(position)
        );

        puzzle.appendChild(tile);

    });

}

function moveTile(position) {

    if (!musicStarted) {
    
        const music =
            document.getElementById("music");
    
        music.volume = 0.2;
        music.play();
    
        musicStarted = true;
    }
    
    const empty =
        tiles.indexOf(15);

    if (
        getNeighbours(empty)
        .includes(position)
    ) {

        [tiles[position], tiles[empty]] =
            [tiles[empty], tiles[position]];

        render();

        checkWin();
    }
}

function checkWin() {

    const solved =
        tiles.every(
            (value, index) => value === index
        );

    if (solved) {

        document
            .getElementById("success")
            .style.display = "block";

            const music =
                document.getElementById("music");
            music.volume = 0.4;
    }
}

initPuzzle();

</script>

</body>

</html>
