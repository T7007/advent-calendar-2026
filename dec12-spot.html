<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Day 12 - Spot The Difference</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body {

            overflow-x: hidden;
        }

        .lights {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 20px;
        }

        .bulb {

            width: 15px;
            height: 15px;

            border-radius: 50%;

            animation:
                twinkle 2s infinite alternate;
        }

        .red {
            background: red;
        }

        .green {
            background: limegreen;
        }

        .gold {
            background: gold;
        }

        .blue {
            background: deepskyblue;
        }

        @keyframes twinkle {

            from {

                opacity: .4;
            }

            to {

                opacity: 1;

                box-shadow:
                    0 0 10px currentColor,
                    0 0 20px currentColor;
            }

        }

        .photos {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;
        }

        .photo-container {

            position: relative;
        }

        .photo-container img {

            width: 350px;

            max-width: 100%;

            border-radius: 10px;
        }

        .hotspot {

            position: absolute;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            cursor: pointer;

            background:
                <!-- rgba(255,0,0,.5); -->
                rgba(255,255,255,0); 

            border:
                2px solid transparent; 
                <!-- px solid yellow; -->
        }

        .found {

            border:
                2px solid gold;

            background:
                rgba(255,215,0,.2);
        }

        .checklist {

            background:
                rgba(255,255,255,.85);

            border-radius: 15px;

            padding: 15px;

            text-align: left;

            margin-bottom: 20px;
        }

        .checklist li {

            list-style: none;

            margin-bottom: 6px;
        }

        .completed {

            color: green;

            font-weight: bold;
        }

        .celebration {

            animation:
                flashLights .5s infinite alternate;
        }

        @keyframes flashLights {

            from {

                box-shadow:
                    0 0 10px gold;
            }

            to {

                box-shadow:
                    0 0 30px gold,
                    0 0 60px gold;
            }

        }

        .sparkles {

            font-size: 2rem;

            animation:
                sparkleBurst 2s ease;
        }

        @keyframes sparkleBurst {

            from {

                opacity: 0;

                transform:
                    scale(.5);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.4);
            }

            to {

                opacity: 0;

                transform:
                    scale(2);
            }

        }

        .hidden {

            display: none;
        }

        .reveal {

            animation:
                fadeIn 1s ease;
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                🔍 Day 12 🔍
            </h1>

            <h2>
                Spot The Difference
            </h2>

            <p>
                Find all 5 differences between the photos.
            </p>

            <div class="lights">

                <div class="bulb red"></div>
                <div class="bulb green"></div>
                <div class="bulb gold"></div>
                <div class="bulb blue"></div>
                <div class="bulb red"></div>

            </div>

            <div class="checklist">

                <ul>

                    <li id="diff1">
                        ⬜ ???
                    </li>
                    
                    <li id="diff2">
                        ⬜ ???
                    </li>
                    
                    <li id="diff3">
                        ⬜ ???
                    </li>
                    
                    <li id="diff4">
                        ⬜ ???
                    </li>
                    
                    <li id="diff5">
                        ⬜ ???
                    </li>

                </ul>

            </div>

            <div class="photos">

                <div class="photo-container">

                    <img src="images/dec12-left.jpg"
                         alt="Original">

                </div>

                <div class="photo-container"
                     id="right-photo">

                    <img src="images/dec12-right.jpg"
                         alt="Edited">

                    <!-- Adjust these positions after testing -->

                    <!-- Santa Hat -->
                    <div class="hotspot"
                         data-id="1"
                         style="
                            top:5px;
                            left:89px;
                            width:30px;
                            height:30px;">
                    </div>

                    <!-- Tree Star -->
                    <div class="hotspot"
                         data-id="2"
                         style="
                            top:9px;
                            left:144px;
                            width:30px;
                            height:30px;">
                    </div>

                    <!-- Ball -->
                    <div class="hotspot"
                         data-id="3"
                         style="
                            top:127px;
                            left:210px;
                            width:35px;
                            height:35px;">
                    </div>

                    <!-- Rebel Logo -->
                    <div class="hotspot"
                         data-id="4"
                         style="
                            top:51px;
                            left:60px;
                            width:30px;
                            height:30px;">
                    </div>

                    <!-- Robot Eye -->
                    <div class="hotspot"
                         data-id="5"
                         style="
                            top:26px;
                            left:89px;
                            width:30px;
                            height:30px;">
                    </div>

                </div>

            </div>

            <div id="message"
                 class="hidden reveal">

                <div class="sparkles">

                    ✨ ⭐ ✨ ⭐ ✨

                </div>

                <h2>
                    🔍 Eagle Eyes! 🔍
                </h2>

                <p>
                    Nothing gets past you.
                </p>

                <p>
                    ✨ You found all 5 differences! ✨
                </p>

                <p>
                    Sherlock Holmes has nothing on you.
                </p>

                <br>

                <h2>
                    ❤️ 25 Days ❤️<br>
                    of Christmas
                </h2>

            </div>

        </div>

    </div>

    <audio id="music">
        <source src="audio/dec12-santa.mp3"
                type="audio/mpeg">
    </audio>

    <script>

        const differenceNames = {
        
            1: "Robot Santa Hat",
            2: "Tree Star",
            3: "Green Ball",
            4: "Rebel Logo",
            5: "Robot Eye"
        
        };
        
        let foundCount = 0;

        let musicStarted = false;

        document
            .querySelectorAll(".hotspot")
            .forEach(hotspot => {

                hotspot.addEventListener(
                    "click",
                    () => {

                        if (
                            hotspot.classList.contains(
                                "found"
                            )
                        ) {
                            return;
                        }

                        if (!musicStarted) {

                            const music =
                                document.getElementById(
                                    "music"
                                );

                            music.volume = 0.2;

                            music.play();

                            musicStarted = true;
                        }

                        hotspot.classList.add(
                            "found"
                        );

                        const id =
                            hotspot.dataset.id;

                        const item =
                            document.getElementById(
                                "diff" + id
                            );

                        item.innerHTML =
                            "✅ " +
                            differenceNames[id];

                        item.classList.add(
                            "completed"
                        );

                        foundCount++;

                        if (
                            foundCount === 5
                        ) {

                            finishGame();
                        }

                    }

                );

            });

        function finishGame() {

            document
                .querySelector(
                    ".card"
                )
                .classList.add(
                    "celebration"
                );

            setTimeout(() => {

                const message =
                    document.getElementById(
                        "message"
                    );

                message.classList.remove(
                    "hidden"
                );

                message.scrollIntoView({
                    behavior: "smooth"
                });

            }, 1500);

        }

    </script>

</body>

</html>
